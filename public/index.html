<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Lmad Cafe — اطلب أونلاين</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- Firebase SDK -->
<!-- Firebase SDK not needed - using Functions REST API directly -->
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --p:#4a6741;--pd:#3a5232;--pl:#e8f5e9;--pl2:#d4edda;
  --bg:#f7f4ee;--card:#fff;--b:#e8e4db;
  --t:#2d3a28;--t2:#7a7a6a;--s:#f0ece3;
  --red:#e74c3c;--green:#27ae60;
}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--t);min-height:100vh;max-width:600px;margin:0 auto;padding-bottom:100px}

/* LANG */
.lang-bar{display:flex;justify-content:flex-end;padding:10px 16px 0;gap:6px;position:relative;z-index:10}
.lbtn{font-family:'Tajawal',sans-serif;font-size:12px;font-weight:800;padding:5px 14px;border-radius:20px;border:1.5px solid var(--b);background:var(--card);color:var(--t2);cursor:pointer;transition:all .2s}
.lbtn.on{background:var(--p);color:#fff;border-color:var(--p)}

/* HERO */
.hero{position:relative;height:min(44vh,360px);min-height:240px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75) 0%,rgba(0,0,0,.2) 60%,transparent 100%)}
.hero-bot{position:absolute;bottom:0;left:0;right:0;padding:16px 20px;display:flex;align-items:flex-end;gap:12px}
.hero-logo{width:72px;height:72px;border-radius:16px;background:rgba(74,103,65,0.85);border:2px solid rgba(255,255,255,.25);box-shadow:0 4px 16px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.hero-logo img{width:100%;height:100%;object-fit:contain;padding:8px}
.hero-name{font-size:22px;font-weight:900;color:#fff}
.hero-sub{font-family:'Poppins',sans-serif;font-size:12px;color:rgba(255,255,255,.7);font-weight:600;letter-spacing:1px}
.hero-tags{display:flex;gap:14px;margin-top:4px}
.hero-tag{font-size:11px;color:rgba(255,255,255,.6)}

/* SCREENS */
.screen{display:none;animation:fadeIn .25s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* TYPE SCREEN */
.type-wrap{padding:28px 20px}
.screen-title{font-size:20px;font-weight:900;text-align:center;margin-bottom:6px}
.screen-sub{font-size:14px;color:var(--t2);text-align:center;margin-bottom:26px}
.type-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tcard{background:var(--card);border:2px solid var(--b);border-radius:20px;padding:28px 16px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:all .22s;box-shadow:0 2px 10px rgba(0,0,0,.05);text-align:center;width:100%;font-family:'Tajawal',sans-serif}
.tcard:hover{border-color:var(--p);background:var(--pl);transform:translateY(-2px)}
.tcard:active{transform:scale(.97)}
.tcard-icon{display:flex;align-items:center;justify-content:center;line-height:1}
.tcard-label{font-size:16px;font-weight:800;color:var(--t)}
.tcard-desc{font-size:12px;color:var(--t2);line-height:1.4}

/* LOADING */
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px;text-align:center}
.spinner{width:44px;height:44px;border:4px solid var(--b);border-top-color:var(--p);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* MENU */
.order-badge-bar{padding:10px 16px 0;display:flex;gap:8px;align-items:center}
.order-badge{background:var(--pl);color:var(--p);font-size:12px;font-weight:800;padding:5px 14px;border-radius:20px;border:1.5px solid var(--pl2)}
.edit-link{background:none;border:none;font-size:12px;color:var(--t2);cursor:pointer;font-family:'Tajawal',sans-serif;font-weight:700}
.cat-bar{position:sticky;top:0;z-index:40;background:rgba(247,244,238,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--b)}
.cat-inner{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
.cat-inner::-webkit-scrollbar{display:none}
.cbtn{flex-shrink:0;padding:7px 16px;border-radius:12px;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;border:none;cursor:pointer;background:var(--s);color:var(--t2);transition:all .2s;white-space:nowrap}
.cbtn.on{background:var(--p);color:#fff}
.menu-body{padding:16px}
.cat-sec{margin-bottom:30px}
.cat-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cat-icon-wrap{width:42px;height:42px;border-radius:11px;background:var(--s);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.cat-title{font-size:17px;font-weight:800}
.cat-cnt{font-size:12px;color:var(--t2)}
.cat-line{flex:1;height:1px;background:var(--b)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:460px){.grid{grid-template-columns:repeat(3,1fr)}}

/* ITEM */
.iitem{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--b);box-shadow:0 2px 8px rgba(0,0,0,.05);transition:box-shadow .25s,transform .25s}
.iitem:hover{box-shadow:0 6px 20px rgba(0,0,0,.1);transform:translateY(-2px)}
.img-wrap{position:relative;aspect-ratio:1;overflow:hidden;background:var(--s)}
.iimg{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.iitem:hover .iimg{transform:scale(1.06)}
.iprice{position:absolute;top:7px;left:7px;background:var(--p);color:#fff;font-family:'Poppins',sans-serif;font-size:11px;font-weight:700;padding:3px 9px;border-radius:18px}
.ibody{padding:9px 9px 11px}
.iname{font-size:12px;font-weight:800;line-height:1.3;margin-bottom:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vars{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:7px}
.vbtn{font-family:'Tajawal',sans-serif;font-size:10px;font-weight:700;padding:3px 7px;border-radius:16px;border:1.5px solid var(--b);background:var(--s);color:var(--t2);cursor:pointer;transition:all .15s}
.vbtn.on{background:var(--p);color:#fff;border-color:var(--p)}
.add-btn{width:100%;background:var(--p);color:#fff;border:none;border-radius:9px;padding:8px 0;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:background .15s}
.add-btn:hover{background:var(--pd)}
.qty-row{display:flex;align-items:center;justify-content:space-between;background:var(--s);border-radius:9px;padding:4px 6px}
.qbtn{width:30px;height:30px;border-radius:8px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;font-weight:900;transition:all .15s}
.qbtn.m{background:#fde8e8;color:var(--red)}.qbtn.p{background:var(--p);color:#fff}
.qnum{font-family:'Poppins',sans-serif;font-size:15px;font-weight:700;min-width:26px;text-align:center}

/* FLOAT CART */
.fcart{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--p);color:#fff;border:none;border-radius:20px;padding:13px 24px;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 8px 28px rgba(74,103,65,.45);font-family:'Tajawal',sans-serif;font-weight:800;font-size:15px;z-index:50;transition:transform .2s;white-space:nowrap;min-width:190px;justify-content:space-between}
.fcart:hover{transform:translateX(-50%) translateY(-2px)}
.fcart.gone{display:none}
.cbadge{background:#fff;color:var(--p);font-size:12px;font-weight:900;border-radius:20px;padding:2px 10px}
.ctotal{font-family:'Poppins',sans-serif;font-size:13px;font-weight:700}

/* MODAL */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.on{opacity:1;pointer-events:all}
.modal{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:600px;background:var(--card);border-radius:28px 28px 0 0;z-index:70;display:flex;flex-direction:column;max-height:90vh;transition:transform .35s cubic-bezier(.32,0,.67,0);box-shadow:0 -8px 40px rgba(0,0,0,.18);overflow:hidden}
.modal.on{transform:translateX(-50%) translateY(0)}
.mhandle{width:40px;height:4px;background:var(--b);border-radius:4px;margin:12px auto 0;flex-shrink:0}
.mhdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 12px;border-bottom:1px solid var(--b);flex-shrink:0}
.mhdr-l{display:flex;align-items:center;gap:10px}
.micon{width:38px;height:38px;border-radius:12px;background:var(--pl);display:flex;align-items:center;justify-content:center;font-size:18px}
.mtitle{font-size:17px;font-weight:900}
.msub{font-size:12px;color:var(--t2)}
.mclose{width:34px;height:34px;border-radius:10px;background:var(--s);border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--t2)}
.mbody{flex:1;overflow-y:auto;padding:16px 20px;scrollbar-width:none}
.mbody::-webkit-scrollbar{display:none}

/* STEP TABS */
.stabs{display:flex;padding:10px 20px 0;flex-shrink:0}
.stab{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:8px 4px;font-size:11px;font-weight:700;color:var(--t2);border-bottom:2px solid transparent;transition:all .2s}
.stab.on{color:var(--p);border-bottom-color:var(--p)}
.sdot{width:18px;height:18px;border-radius:50%;background:var(--b);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:var(--t2);flex-shrink:0;transition:all .2s}
.stab.on .sdot{background:var(--p);color:#fff}

/* CART ITEMS */
.cart-empty{display:flex;flex-direction:column;align-items:center;padding:48px 0;gap:10px;text-align:center}
.ci{display:flex;align-items:center;gap:10px;background:var(--s);border-radius:14px;padding:10px;margin-bottom:10px}
.ci img{width:52px;height:52px;border-radius:11px;object-fit:cover;flex-shrink:0;background:#ddd}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:13px;font-weight:800}
.ci-var{font-size:11px;color:var(--t2)}
.ci-price{font-size:13px;font-weight:800;color:var(--p);margin-top:2px}
.ci-qty{display:flex;align-items:center;gap:7px;flex-shrink:0}
.cqbtn{width:28px;height:28px;border-radius:8px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;font-weight:900}
.cqbtn.m{background:#fff;color:var(--red);border:1px solid var(--b)}
.cqbtn.p{background:var(--p);color:#fff}
.cqnum{font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;min-width:20px;text-align:center}

/* FORM */
.fg{margin-bottom:14px}
.flabel{font-size:13px;font-weight:800;color:var(--t);margin-bottom:7px;display:block}
.finput{width:100%;padding:12px 14px;border-radius:12px;background:var(--s);border:1.5px solid var(--b);font-family:'Tajawal',sans-serif;font-size:14px;color:var(--t);outline:none;transition:border-color .2s}
.finput:focus{border-color:var(--p)}
.finput::placeholder{color:#bbb}
.ftxt{width:100%;padding:11px 14px;border-radius:12px;background:var(--s);border:1.5px solid var(--b);font-family:'Tajawal',sans-serif;font-size:14px;color:var(--t);outline:none;resize:none;min-height:70px}
.ftxt:focus{border-color:var(--p)}
.table-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tbtn{aspect-ratio:1;border-radius:10px;border:2px solid var(--b);background:var(--s);font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s}
.tbtn.on{background:var(--p);color:#fff;border-color:var(--p)}
.tbtn:hover:not(.on){border-color:var(--p);color:var(--p)}

/* ORDER SUMMARY */
.summary{background:var(--pl);border-radius:14px;padding:14px;margin-bottom:14px;border:1px solid var(--pl2)}
.sum-title{font-size:12px;font-weight:800;color:var(--p);margin-bottom:10px}
.sum-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:8px}
.sum-row span:first-child{color:var(--t2)}
.sum-total{font-weight:800;font-size:15px;border-top:1px solid var(--pl2);padding-top:8px;margin-top:8px}

/* PRINTING */
.printing-wrap{display:flex;flex-direction:column;align-items:center;padding:40px 20px;text-align:center;gap:14px}
.print-steps{display:flex;flex-direction:column;gap:10px;width:100%;max-width:260px;margin-top:8px}
.pstep{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--t2)}
.pstep.done{color:var(--green)}.pstep.active{color:var(--p)}
.pico{font-size:18px;width:24px;flex-shrink:0;text-align:center}

/* SUCCESS */
.success-wrap{display:flex;flex-direction:column;align-items:center;padding:36px 20px;text-align:center;gap:12px}
.s-circle{width:88px;height:88px;border-radius:50%;background:var(--pl);display:flex;align-items:center;justify-content:center;font-size:42px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.s-title{font-size:22px;font-weight:900}
.s-num{font-size:14px;color:var(--t2)}
.s-num strong{font-family:'Poppins',sans-serif;color:var(--p);font-weight:800}
.s-badge{background:var(--pl);color:var(--p);font-size:13px;font-weight:800;padding:6px 18px;border-radius:20px;border:1.5px solid var(--pl2)}
.s-box{background:var(--card);border:1.5px solid var(--b);border-radius:16px;padding:16px;width:100%}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#25D366;color:#fff;border:none;border-radius:14px;padding:14px;font-family:'Tajawal',sans-serif;font-size:15px;font-weight:800;cursor:pointer;text-decoration:none;box-shadow:0 4px 14px rgba(37,211,102,.3)}
.wa-btn:hover{background:#1eb358}
.new-btn{width:100%;background:var(--s);color:var(--t2);border:1.5px solid var(--b);border-radius:13px;padding:12px;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:700;cursor:pointer}

/* MODAL FOOTER */
.mfoot{padding:14px 20px 20px;border-top:1px solid var(--b);flex-shrink:0;background:var(--card)}
.tbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.tlbl{font-size:14px;font-weight:700;color:var(--t2)}
.tamt{font-family:'Poppins',sans-serif;font-size:22px;font-weight:800;color:var(--p)}
.mbtn{width:100%;padding:14px;border-radius:14px;border:none;font-family:'Tajawal',sans-serif;font-size:16px;font-weight:800;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.mbtn.pri{background:var(--p);color:#fff;box-shadow:0 4px 14px rgba(74,103,65,.28)}
.mbtn.pri:hover{background:var(--pd)}.mbtn.pri:active{transform:scale(.98)}
.mbtn.pri:disabled{opacity:.6;cursor:not-allowed}
.mbtn.sec{background:transparent;color:var(--t2);font-size:14px;padding:10px;margin-top:4px}
.mbtn.sec:hover{background:var(--s)}

/* SITE FOOTER */
.sf{background:var(--card);border-top:1px solid var(--b);padding:22px 20px 80px;text-align:center}
.sf-logo{font-size:26px;margin-bottom:6px}
.sf-name{font-size:13px;color:var(--t2);font-weight:700}
.sf-loc{font-size:11px;color:var(--t2);opacity:.55;margin-top:2px}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.err{border-color:var(--red)!important;animation:shake .3s ease}
</style>
</head>

<script>
// ─── CONFIG ────────────────────────────────────────────────────
// ⚠️ استبدل هذا بعنوان مشروع Firebase الخاص بك
const FIREBASE_PROJECT = "lmad-bfa29";
const API_BASE = `https://us-central1-lmad-bfa29.cloudfunctions.net/api`;
const CAFE_WHATSAPP = "96898631511";
const TABLES = 15;

// Firebase config — أضف هذا بعد إنشاء المشروع
// Firebase config - used server-side only
// Firebase initialized via Functions REST API - no client SDK needed

// ─── STATE ─────────────────────────────────────────────────────
let lang      = 'ar';
let orderType = '';
let tableNum  = 0;
let cart      = {};
let selVar    = {};
let step      = 'cart';
let lastOrder = '';
let lastOrderId = '';
let lastPhone = '';
let allItems  = [];
let allCats   = [];

const t   = (ar, en) => lang === 'ar' ? ar : en;
const iN  = item => item.item_name;
const vN  = v => v.option1_value || t('عادي','Regular');
const qtyTotal  = () => Object.values(cart).reduce((s,c)=>s+c.qty,0);
const priceTotal= () => Object.values(cart).reduce((s,c)=>s+(getPrice(findItem(c.id).variants[c.vi])*c.qty),0);

function getPrice(variant) {
  const STORE_ID = "d41322ee-6567-4d1b-8668-d341be71cba9";
  const s = variant.stores?.find(s=>s.store_id===STORE_ID);
  return s?.price ?? variant.default_price ?? 0;
}
function findItem(id){ return allItems.find(i=>i.id===id); }

// ─── LANG ──────────────────────────────────────────────────────
function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir  = l==='ar'?'rtl':'ltr';
  document.querySelectorAll('.lbtn').forEach(b=>{
    b.classList.toggle('on',(b.textContent.trim()==='عربي'&&l==='ar')||(b.textContent.trim()==='English'&&l==='en'));
  });
  applyStaticText();
  renderCatBar(); renderMenu('all');
  if(document.getElementById('modal').classList.contains('on')) renderModal();
}

function applyStaticText(){
  const tx = {
    heroName:   t('لمد كافية','Lmad Cafe'),
    heroLoc:    t('📍 الجبل الأخضر','📍 Al Jabal Al Akhdar'),
    heroOnline: t('🕐 طلب أونلاين','🕐 Online Order'),
    typeTitle:  t('كيف تريد طلبك؟','How would you like to order?'),
    typeSub:    t('اختر طريقة الاستلام','Choose your order type'),
    lblTable:   t('طاولة','Dine In'),
    
    lblCar:     t('استلام بالسيارة','Curbside'),
    
    editLbl:    t('← تعديل','← Change'),
    loadingTxt: t('جاري تحميل القائمة...','Loading menu...'),
    fcLbl:      t('السلة','Cart'),
    st1l:       t('السلة','Cart'),
    st2l:       t('بياناتك','Details'),
    st3l:       t('إرسال','Sending'),
    sTitle:     t('تم استلام طلبك!','Order Received!'),
    sLbl:       t('رقم الطلب:','Order #:'),
    prepTitle:  t('طلبك قيد التحضير','Your order is being prepared'),
    prepSub:    t('سيتم التواصل معك على واتساب فور الجاهزية',"You'll be notified on WhatsApp when ready"),
    waLbl:      t('افتح واتساب للتواصل','Open WhatsApp'),
    newLbl:     t('🔄 طلب جديد','🔄 New Order'),
    sfLoc:      t('📍 الجبل الأخضر، عُمان','📍 Al Jabal Al Akhdar, Oman'),
  };
  Object.entries(tx).forEach(([id,val])=>{ const el=document.getElementById(id); if(el) el.textContent=val; });
}

// ─── SCREENS ───────────────────────────────────────────────────
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

// ─── TYPE ──────────────────────────────────────────────────────
function pickType(type){
  orderType = type; tableNum = 0;
  const el = document.getElementById('orderBadge');
  if(el) el.textContent = type==='table' ? t('🪑 طاولة','🪑 Dine In') : t('🚗 استلام بالسيارة','🚗 Curbside');
  show('sMenu');
  loadMenu();
}

// ─── LOAD MENU FROM API ────────────────────────────────────────
async function loadMenu(){
  if(allItems.length > 0){ renderCatBar(); renderMenu('all'); return; }
  document.getElementById('menuLoading').style.display = 'flex';
  document.getElementById('menuBody').style.display = 'none';
  try {
    const [catsRes, itemsRes] = await Promise.all([
      fetch(`${API_BASE}/menu/categories`).then(r=>r.json()),
      fetch(`${API_BASE}/menu/items`).then(r=>r.json()),
    ]);
    if(catsRes.ok)  allCats  = catsRes.data;
    if(itemsRes.ok) allItems = itemsRes.data;
    allItems.forEach(i=>{ selVar[i.id]=0; });
  } catch(e) {
    console.error('Menu load failed:', e);
    document.getElementById('menuLoading').innerHTML =
      `<div style="color:var(--red);font-weight:800">${t('فشل تحميل القائمة. تحقق من اتصالك.','Failed to load menu.')}</div>
       <button onclick="loadMenu()" style="margin-top:10px;padding:10px 20px;background:var(--p);color:#fff;border:none;border-radius:10px;cursor:pointer;font-family:Tajawal,sans-serif;font-weight:700">${t('إعادة المحاولة','Retry')}</button>`;
    return;
  }
  document.getElementById('menuLoading').style.display = 'none';
  document.getElementById('menuBody').style.display = 'block';
  renderCatBar();
  renderMenu('all');
}

// ─── RENDER ────────────────────────────────────────────────────
const CATEGORY_ORDER = [
  "282aa989-eb63-4a19-b944-bdaee3cf7f36",
  "74e4e894-6b2d-4d99-bbd7-22bb51dff3a7",
  "17c15070-b30f-4773-8506-2a5f6c6038b4",
  "a7bc39cd-6538-4044-b187-a32b3c9d0a3f",
  "02c94191-769c-4b80-99db-d4e78e830eee",
];

function sortedCats(){
  return [...allCats].sort((a,b)=>{
    const ai=CATEGORY_ORDER.indexOf(a.id), bi=CATEGORY_ORDER.indexOf(b.id);
    return (ai===-1?999:ai)-(bi===-1?999:bi);
  });
}

function renderCatBar(){
  const bar = document.getElementById('catBar');
  bar.innerHTML = '';
  const all = document.createElement('button');
  all.className='cbtn on'; all.textContent=t('الكل','All');
  all.onclick=()=>filterCat('all',all); bar.appendChild(all);
  sortedCats().forEach(cat=>{
    const items = allItems.filter(i=>i.category_id===cat.id);
    if(!items.length) return;
    const b=document.createElement('button');
    b.className='cbtn'; b.textContent=cat.name;
    b.onclick=()=>filterCat(cat.id,b); bar.appendChild(b);
  });
}

function renderMenu(filter){
  const body=document.getElementById('menuBody'); body.innerHTML='';
  const cats = sortedCats();
  cats.forEach(cat=>{
    const items = allItems.filter(i=>i.category_id===cat.id);
    if(!items.length) return;
    if(filter!=='all' && filter!==cat.id) return;
    const sec=document.createElement('div'); sec.className='cat-sec';
    sec.innerHTML=`
      <div class="cat-hdr">
        <div class="cat-icon-wrap">☕</div>
        <div><div class="cat-title">${cat.name}</div><div class="cat-cnt">${items.length} ${t('عنصر','items')}</div></div>
        <div class="cat-line"></div>
      </div>
      <div class="grid" id="g-${cat.id}"></div>`;
    body.appendChild(sec);
    items.forEach(item=>{
      const card=document.createElement('div');
      card.className='iitem'; card.id='card-'+item.id;
      renderCard(card,item);
      sec.querySelector('.grid').appendChild(card);
    });
  });
}

function renderCard(el, item){
  const STORE="d41322ee-6567-4d1b-8668-d341be71cba9";
  const availVars = item.variants.filter(v=>v.stores?.some(s=>s.store_id===STORE&&s.available_for_sale));
  if(!availVars.length) return;
  const vi=Math.min(selVar[item.id]||0, availVars.length-1);
  const v=availVars[vi];
  const price=getPrice(v);
  const key=`${item.id}-${vi}`;
  const q=cart[key]?.qty||0;

  const varsHtml=availVars.length>1
    ?`<div class="vars">${availVars.map((vv,i)=>`<button class="vbtn${i===vi?' on':''}" onclick="selV('${item.id}',${i},event)">${vN(vv)}</button>`).join('')}</div>`:'' ;

  const action=q===0
    ?`<button class="add-btn" onclick="addI('${item.id}',${vi},event)">+ ${t('أضف','Add')}</button>`
    :`<div class="qty-row">
        <button class="qbtn m" onclick="chgQ('${item.id}',${vi},-1,event)">${q===1?'🗑':'−'}</button>
        <span class="qnum">${q}</span>
        <button class="qbtn p" onclick="addI('${item.id}',${vi},event)">+</button>
      </div>`;

  el.innerHTML=`
    <div class="img-wrap">
      <img class="iimg" src="${item.image_url||'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=300&h=300&fit=crop'}"
        onerror="this.src='https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=300&h=300&fit=crop'">
      <div class="iprice">${price.toFixed(3)} OMR</div>
    </div>
    <div class="ibody">
      <div class="iname">${item.item_name}</div>
      ${varsHtml}
      ${action}
    </div>`;
}

function reCard(id){ const el=document.getElementById('card-'+id); if(el&&findItem(id)) renderCard(el,findItem(id)); }
function selV(id,vi,e){ e.stopPropagation(); selVar[id]=vi; reCard(id); }

function addI(id,vi,e){
  e.stopPropagation();
  const key=`${id}-${vi}`;
  if(!cart[key]) cart[key]={id,vi,qty:0};
  cart[key].qty++; reCard(id); updateFloat();
}
function chgQ(id,vi,d,e){
  e.stopPropagation();
  const key=`${id}-${vi}`;
  if(!cart[key]) return;
  cart[key].qty=Math.max(0,cart[key].qty+d);
  if(cart[key].qty===0) delete cart[key];
  reCard(id); updateFloat();
}
function filterCat(cat,btn){
  document.querySelectorAll('.cbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); renderMenu(cat);
}

// ─── FLOAT CART ────────────────────────────────────────────────
function updateFloat(){
  const q=qtyTotal(), fc=document.getElementById('fcart');
  fc.classList.toggle('gone',q===0);
  document.getElementById('cBadge').textContent=q;
  document.getElementById('cTotal').textContent=priceTotal().toFixed(3)+' OMR';
  if(document.getElementById('modal').classList.contains('on')) renderModal();
}

// ─── MODAL ─────────────────────────────────────────────────────
function openModal(){ step='cart'; document.getElementById('backdrop').classList.add('on'); document.getElementById('modal').classList.add('on'); renderModal(); }
function closeModal(){ document.getElementById('backdrop').classList.remove('on'); document.getElementById('modal').classList.remove('on'); }

function renderModal(){
  ['st1','st2','st3'].forEach((id,i)=>{
    document.getElementById(id).classList.toggle('on',['cart','info','printing'].indexOf(step)>=i);
  });

  const body=document.getElementById('mbody'), foot=document.getElementById('mfoot');
  const cartItems=Object.values(cart).filter(c=>c.qty>0);
  const total=priceTotal();

  if(step==='cart'){
    document.getElementById('micon').textContent='🛒';
    document.getElementById('mtitle').textContent=t('سلة المشتريات','Cart');
    document.getElementById('msub').textContent=cartItems.length?`${qtyTotal()} ${t('عنصر','items')}`:'' ;

    if(!cartItems.length){
      body.innerHTML=`<div class="cart-empty">
        <div style="font-size:48px">🛒</div>
        <div style="font-size:16px;font-weight:800">${t('السلة فارغة','Cart is empty')}</div>
        <div style="font-size:13px;color:var(--t2)">${t('أضف بعض العناصر من القائمة','Add items from the menu')}</div>
      </div>`;
      foot.innerHTML=''; return;
    }

    body.innerHTML=cartItems.map(c=>{
      const item=findItem(c.id);
      const STORE="d41322ee-6567-4d1b-8668-d341be71cba9";
      const availVars=item.variants.filter(v=>v.stores?.some(s=>s.store_id===STORE&&s.available_for_sale));
      const v=availVars[Math.min(c.vi,availVars.length-1)];
      const price=getPrice(v);
      return `<div class="ci">
        <img src="${item.image_url||'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=80&h=80&fit=crop'}"
          onerror="this.src='https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=80&h=80&fit=crop'">
        <div class="ci-info">
          <div class="ci-name">${item.item_name}</div>
          ${availVars.length>1?`<div class="ci-var">${vN(v)}</div>`:''}
          <div class="ci-price">${(price*c.qty).toFixed(3)} OMR</div>
        </div>
        <div class="ci-qty">
          <button class="cqbtn m" onclick="mQty('${c.id}',${c.vi},-1)">${c.qty===1?'🗑':'−'}</button>
          <span class="cqnum">${c.qty}</span>
          <button class="cqbtn p" onclick="mQty('${c.id}',${c.vi},1)">+</button>
        </div>
      </div>`;
    }).join('');

    foot.innerHTML=`
      <div class="tbar"><span class="tlbl">${t('المجموع','Total')}</span><span class="tamt">${total.toFixed(3)} OMR</span></div>
      <button class="mbtn pri" onclick="goInfo()">${t('متابعة الطلب','Continue')} ←</button>`;
  }

  else if(step==='info'){
    document.getElementById('micon').textContent='👤';
    document.getElementById('mtitle').textContent=t('بياناتك','Your Details');
    document.getElementById('msub').textContent='';

    const tableFields = orderType==='table'
      ?`<div class="fg">
          <label class="flabel">${t('رقم الطاولة','Table Number')}</label>
          <div class="table-grid" id="tableGrid"></div>
        </div>`
      :`<div class="fg">
          <label class="flabel">${t('لون ونوع السيارة','Car color & model')}</label>
          <input class="finput" id="carDesc" type="text" placeholder="${t('مثال: لاندكروزر أبيض','e.g. White Land Cruiser')}">
        </div>`;

    body.innerHTML=`
      <div class="summary">
        <div class="sum-title">📋 ${t('ملخص الطلب','Order Summary')}</div>
        <div class="sum-row"><span>${t('نوع الطلب','Type')}</span><span>${orderType==='table'?t('🪑 طاولة','🪑 Dine In'):t('🚗 سيارة','🚗 Curbside')}</span></div>
        ${cartItems.map(c=>{
          const item=findItem(c.id);
          const STORE="d41322ee-6567-4d1b-8668-d341be71cba9";
          const availVars=item.variants.filter(v=>v.stores?.some(s=>s.store_id===STORE&&s.available_for_sale));
          const v=availVars[Math.min(c.vi,availVars.length-1)];
          return `<div class="sum-row"><span>${item.item_name}${availVars.length>1?' — '+vN(v):''} ×${c.qty}</span><span>${(getPrice(v)*c.qty).toFixed(3)}</span></div>`;
        }).join('')}
        <div class="sum-row sum-total"><span>${t('الإجمالي','Total')}</span><span>${total.toFixed(3)} OMR</span></div>
      </div>
      <div class="fg">
        <label class="flabel">${t('الاسم','Name')}</label>
        <input class="finput" id="custName" type="text" placeholder="${t('أدخل اسمك','Enter your name')}">
      </div>
      <div class="fg">
        <label class="flabel">${t('رقم الهاتف','Phone')}</label>
        <input class="finput" id="custPhone" type="tel" placeholder="${t('مثال: 79891624','e.g. 79891624')}" dir="ltr" style="text-align:left">
      </div>
      ${tableFields}
      <div class="fg">
        <label class="flabel">💬 ${t('ملاحظات','Notes')} <span style="font-size:11px;color:#aaa;font-weight:400">(${t('اختياري','optional')})</span></label>
        <textarea class="ftxt" id="orderNotes" placeholder="${t('أي ملاحظات إضافية...','Any special requests...')}"></textarea>
      </div>`;

    if(orderType==='table'){
      const g=document.getElementById('tableGrid');
      for(let i=1;i<=TABLES;i++){
        const b=document.createElement('button');
        b.className='tbtn'+(i===tableNum?' on':'');
        b.textContent=i;
        b.onclick=()=>{ tableNum=i; g.querySelectorAll('.tbtn').forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
        g.appendChild(b);
      }
    }

    foot.innerHTML=`
      <button class="mbtn pri" id="confirmBtn" onclick="submitOrder()">${t('تأكيد وإرسال الطلب','Confirm & Place Order')} ✓</button>
      <button class="mbtn sec" id="backBtn">${t('← تعديل السلة','← Edit Cart')}</button>`;
    document.getElementById('backBtn').onclick=()=>{step='cart';renderModal();};
  }

  else if(step==='printing'){
    document.getElementById('micon').textContent='🖨';
    document.getElementById('mtitle').textContent=t('جاري تجهيز الطلب','Processing');
    document.getElementById('msub').textContent='';
    body.innerHTML=`
      <div class="printing-wrap">
        <div class="spinner"></div>
        <div style="font-size:17px;font-weight:900">${t('جاري إرسال طلبك','Sending your order...')}</div>
        <div class="print-steps">
          <div class="pstep done"   id="ps1"><span class="pico">✅</span>${t('تم حفظ الطلب','Order saved')}</div>
          <div class="pstep active" id="ps2"><span class="pico">🖨</span>${t('جاري الإرسال...','Sending...')}</div>
          <div class="pstep"        id="ps3"><span class="pico">⭕</span>${t('تأكيد الطلب','Confirming')}</div>
        </div>
      </div>`;
    foot.innerHTML='';
  }
}

function mQty(id,vi,d){
  const key=`${id}-${vi}`; if(!cart[key]) return;
  cart[key].qty=Math.max(0,cart[key].qty+d);
  if(cart[key].qty===0) delete cart[key];
  reCard(id); updateFloat(); renderModal();
}

function goInfo(){ if(!qtyTotal()) return; step='info'; renderModal(); }

async function submitOrder(){
  const name=(document.getElementById('custName')?.value||'').trim();
  const phone=(document.getElementById('custPhone')?.value||'').trim();
  if(!name){ markErr('custName'); return; }
  if(!phone){ markErr('custPhone'); return; }
  if(orderType==='table'&&!tableNum){ showToast(t('اختر رقم طاولتك','Select a table')); return; }
  if(orderType==='car'){
    const car=(document.getElementById('carDesc')?.value||'').trim();
    if(!car){ markErr('carDesc'); return; }
  }

  const carDesc=(document.getElementById('carDesc')?.value||'').trim();
  const notes=(document.getElementById('orderNotes')?.value||'').trim();
  lastPhone=phone;

  step='printing'; renderModal();

  // Step 2 animation
  setTimeout(()=>{
    const ps2=document.getElementById('ps2');
    if(ps2){ps2.classList.remove('active');ps2.classList.add('done');ps2.querySelector('.pico').textContent='✅';}
    const ps3=document.getElementById('ps3');
    if(ps3) ps3.classList.add('active');
  },900);

  try {
    const cartItems=Object.values(cart).filter(c=>c.qty>0);
    const STORE="d41322ee-6567-4d1b-8668-d341be71cba9";
    const body={
      customerName:name, customerPhone:phone,
      orderType, tableNum:tableNum||null, carDesc:carDesc||null, notes,
      items: cartItems.map(c=>{
        const item=findItem(c.id);
        const availVars=item.variants.filter(v=>v.stores?.some(s=>s.store_id===STORE&&s.available_for_sale));
        const v=availVars[Math.min(c.vi,availVars.length-1)];
        return { variantId:v.variant_id, quantity:c.qty, price:getPrice(v), itemId:item.id, itemName:item.item_name, variantName:v.option1_value||'' };
      }),
    };

    const res=await fetch(`${API_BASE}/orders/create`,{
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body),
    }).then(r=>r.json());

    if(!res.ok) throw new Error(res.error||'Failed');

    const ps3=document.getElementById('ps3');
    if(ps3){ps3.classList.remove('active');ps3.classList.add('done');ps3.querySelector('.pico').textContent='✅';}

    lastOrder=res.data.receiptNumber;
    lastOrderId=res.data.orderId;

    setTimeout(()=>{
      closeModal();
      cart={}; updateFloat();
      allItems.forEach(i=>{ selVar[i.id]=0; renderMenu('all'); });
      showSuccess(name,phone);
    },700);

  } catch(err){
    step='info'; renderModal();
    showToast(t('❌ فشل الإرسال. حاول مجدداً','❌ Failed. Please try again'));
  }
}

function showSuccess(name,phone){
  document.getElementById('sNum').textContent=lastOrder;
  const typeLabel=orderType==='table'?t(`🪑 طاولة ${tableNum}`,`🪑 Table ${tableNum}`):t('🚗 استلام بالسيارة','🚗 Curbside');
  document.getElementById('sBadge').textContent=typeLabel;

  // WhatsApp من الكافيه للزبون
  const custPhone=phone.replace(/\D/g,'');
  const intl=custPhone.startsWith('968')?custPhone:'968'+custPhone;
  const msg=lang==='ar'
    ?`مرحبا ${name} 👋\n\nطلبك رقم *${lastOrder}* (${typeLabel}) قيد التحضير الآن ☕\nسنبلغك فور الجاهزية!`
    :`Hi ${name} 👋\n\nYour order *${lastOrder}* (${typeLabel}) is being prepared ☕\nWe'll notify you when ready!`;
  document.getElementById('waBtn').href=`https://wa.me/${intl}?text=${encodeURIComponent(msg)}`;

  applyStaticText();
  show('sSuccess');
}

function startOver(){
  cart={}; orderType=''; tableNum=0; lastOrder=''; lastOrderId=''; step='cart';
  updateFloat(); show('sType');
}

function markErr(id){
  const el=document.getElementById(id); if(!el) return;
  el.classList.add('err');
  setTimeout(()=>el.classList.remove('err'),500);
}

function showToast(msg){
  let el=document.getElementById('_toast');
  if(!el){
    el=document.createElement('div'); el.id='_toast';
    el.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(60px);background:#2d3a28;color:#fff;padding:9px 20px;border-radius:20px;font-size:13px;font-weight:700;white-space:nowrap;z-index:9999;transition:transform .3s cubic-bezier(.34,1.56,.64,1)';
    document.body.appendChild(el);
  }
  el.textContent=msg;
  setTimeout(()=>el.style.transform='translateX(-50%) translateY(0)',10);
  clearTimeout(el._t); el._t=setTimeout(()=>el.style.transform='translateX(-50%) translateY(60px)',2500);
}

// ─── INIT ──────────────────────────────────────────────────────
applyStaticText();
</script>
</body>
</html>
